name: Build Luna APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'luna-android/**'
      - '.github/workflows/build-luna-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        working-directory: luna-android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Fetch Luna web assets
        working-directory: luna-android
        run: |
          chmod +x scripts/fetch-assets.sh
          ./scripts/fetch-assets.sh

      - name: Make gradlew executable
        working-directory: luna-android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: luna-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        working-directory: luna-android
        run: |
          ls -lh app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-debug-apk
          path: luna-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
